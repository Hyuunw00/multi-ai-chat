<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>Multi AI Chat</title>
  <base target="_blank">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f4f1; --card: #fff; --text: #1c1c1a; --muted: #85857f; --border: #e3e3de;
      --accent: #1c1c1a; --accent-text: #fff; --subtle: #ebebe6;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #18181a; --card: #232326; --text: #ececec; --muted: #8d8d93; --border: #34343a;
        --accent: #ececec; --accent-text: #18181a; --subtle: #2e2e33;
      }
    }

    html, body { height: 100%; margin: 0; }
    [hidden] { display: none !important; }
    body { display: flex; flex-direction: column; font: 14px/1.5 system-ui, sans-serif; color: var(--text); background: var(--bg); }
    button { padding: 5px 12px; font: inherit; color: inherit; background: none; border: 0; border-radius: 7px; cursor: pointer; }

    body > header { display: flex; align-items: center; justify-content: space-between; padding: 8px 16px; border-bottom: 1px solid var(--border); }
    .brand { font-size: 15px; }
    .actions { display: flex; align-items: center; gap: 10px; }
    .segmented { display: flex; padding: 3px; background: var(--subtle); border-radius: 9px; }
    .segmented button { color: var(--muted); }
    .segmented button[aria-pressed="true"] { color: var(--text); background: var(--card); box-shadow: 0 1px 2px rgb(0 0 0 / .15); }
    .ghost { border: 1px solid var(--border); }
    .ghost:hover { background: var(--subtle); }
    #ai-chips { display: flex; gap: 6px; }
    .chip { display: flex; align-items: center; gap: 6px; padding: 4px 10px; border: 1px solid var(--border); border-radius: 999px; }
    .chip::before { content: ''; width: 8px; height: 8px; background: var(--brand); border-radius: 50%; }
    .chip[aria-pressed="false"] { color: var(--muted); border-style: dashed; }
    .chip[aria-pressed="false"]::before { background: var(--border); }
    /* 순서 번호와 단계 표시는 교차검증에서만 보인다. */
    .order, .step { padding: 0 6px; font-size: 11px; font-weight: 600; color: var(--muted); background: var(--subtle); border-radius: 999px; }
    body:not([data-mode="chain"]) :is(.order, .step), .order:empty { display: none; }
    body[data-mode="chain"] :is(.judge, #synthesize) { display: none; }

    main { flex: 1; position: relative; min-height: 0; }
    #frames { position: absolute; inset: 0; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 1px; background: var(--border); }
    iframe { width: 100%; height: 100%; border: 0; background: #fff; }

    /* 답변 화면은 사이트 화면 위를 덮는다. iframe을 숨기지 않아야 스트리밍이 멈추지 않는다. */
    #answers { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 12px; padding: 12px 16px 4px; background: var(--bg); }
    #question-bar { flex: none; display: flex; align-items: center; gap: 12px; padding: 8px 8px 8px 14px; background: var(--subtle); border-radius: 12px; }
    #question { flex: 1; max-height: 4.5em; margin: 0; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; }
    #question::before { content: '질문'; margin-right: 10px; font-size: 12px; font-weight: 600; color: var(--muted); }
    .judge { flex: none; font-size: 12px; color: var(--muted); }
    .judge select { padding: 4px 6px; font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--border); border-radius: 7px; }
    #synthesize { flex: none; padding: 7px 14px; font-weight: 600; color: var(--accent-text); background: var(--accent); }
    #synthesize:disabled { opacity: .25; cursor: default; }
    #columns { flex: 1; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 12px; min-height: 0; }

    /* 종합 칸: 세 사이트 색을 이은 띠로 여러 답변을 합친 결과임을 나타낸다. */
    #synthesis { flex: 1.3; overflow: hidden; }
    #synthesis::before { content: ''; flex: none; height: 3px; background: linear-gradient(90deg, #10a37f, #4285f4, #d97757); }
    #synthesis > header h2::before { content: none; }
    #sources { display: flex; gap: 6px; font-weight: 400; }
    .source { display: flex; align-items: center; gap: 5px; padding: 1px 8px; font-size: 12px; background: var(--subtle); border-radius: 999px; }
    .source::before { content: ''; width: 6px; height: 6px; background: var(--brand); border-radius: 50%; }
    .byline { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); }

    .column { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--card); border: 1px solid var(--border); border-radius: 14px; }
    .column > header { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px 8px 16px; border-bottom: 1px solid var(--border); }
    .column > header h2 { display: flex; align-items: center; gap: 8px; margin: 0; font-size: 14px; }
    .column > header h2::before { content: ''; width: 8px; height: 8px; background: var(--brand); border-radius: 50%; }
    .copy { font-size: 12px; color: var(--muted); }
    .copy:hover { color: var(--text); background: var(--subtle); }
    .column:not([data-state="answer"]) .copy { visibility: hidden; }
    /* 교차검증의 마지막 단계 칸 */
    body[data-mode="chain"] .column.final { border-color: var(--muted); }
    body[data-mode="chain"] .column.final .step { color: var(--accent-text); background: var(--accent); }

    .answer { flex: 1; overflow: auto; padding: 4px 16px 16px; font-size: 15px; line-height: 1.65; overflow-wrap: anywhere; }
    .column[data-state="empty"] .answer::before { content: '프롬프트를 보내면 답변이 여기에 표시됩니다.'; display: block; margin-top: 12px; color: var(--muted); font-size: 14px; }
    .column[data-state="queued"] .answer::before { content: '앞 단계의 답변을 기다리는 중입니다.'; display: block; margin-top: 12px; color: var(--muted); font-size: 14px; }
    .column[data-state="blocked"] .answer { padding-top: 12px; font-size: 14px; color: var(--muted); }
    /* 답변이 오래 오지 않으면 25초 뒤에 안내를 띄운다. */
    .column[data-state="waiting"] .answer::after { content: '답변이 늦어지면 오른쪽 위 \'사이트\'에서 로그인 상태나 오류를 확인해 보세요.'; display: block; margin-top: 16px; font-size: 13px; color: var(--muted); opacity: 0; animation: appear 0s 25s forwards; }
    @keyframes appear { to { opacity: 1; } }
    /* 답변이 오기 전까지 보여주는 스켈레톤 3줄 */
    .column[data-state="waiting"] .answer::before {
      content: ''; display: block; height: 68px; margin-top: 16px;
      background:
        linear-gradient(var(--subtle) 0 0) 0 0 / 88% 14px no-repeat,
        linear-gradient(var(--subtle) 0 0) 0 27px / 100% 14px no-repeat,
        linear-gradient(var(--subtle) 0 0) 0 54px / 55% 14px no-repeat;
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse { 50% { opacity: .4; } }
    @media (prefers-reduced-motion: reduce) { .column[data-state="waiting"] .answer::before { animation: none; } }

    .answer h1, .answer h2, .answer h3, .answer h4 { margin: 1.2em 0 .4em; font-size: 16px; }
    .answer pre { overflow: auto; padding: 12px; font-size: 13px; background: var(--subtle); border-radius: 8px; }
    .answer table { border-collapse: collapse; }
    .answer th, .answer td { padding: 6px 10px; border: 1px solid var(--border); text-align: left; }
    .answer blockquote { margin: 0; padding-left: 12px; color: var(--muted); border-left: 3px solid var(--border); }
    .answer a { color: inherit; }
    .answer svg { display: none; }

    form { padding: 10px 16px 10px; }
    .composer { display: flex; align-items: flex-end; gap: 8px; max-width: 860px; margin: 0 auto; padding: 8px 8px 8px 18px; background: var(--card); border: 1px solid var(--border); border-radius: 22px; }
    .composer:focus-within { border-color: var(--muted); }
    textarea { flex: 1; box-sizing: border-box; max-height: 200px; padding: 7px 0; font: inherit; font-size: 15px; color: inherit; background: none; border: 0; outline: 0; resize: none; }
    #send { width: 36px; height: 36px; padding: 0; font-size: 18px; color: var(--accent-text); background: var(--accent); border-radius: 50%; }
    #send:disabled { opacity: .25; cursor: default; }
    .hint { display: flex; justify-content: center; align-items: center; gap: 16px; margin: 6px 0 0; font-size: 12px; color: var(--muted); }
    .hint label { display: flex; align-items: center; gap: 5px; cursor: pointer; }
    .hint input { margin: 0; accent-color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <div class="actions">
      <strong class="brand">Multi AI Chat</strong>
      <div class="segmented" role="group" aria-label="방식">
        <button type="button" id="mode-synthesis" title="선택한 AI에게 동시에 묻고, 답변을 나란히 비교·종합합니다">종합</button>
        <button type="button" id="mode-chain" title="첫 AI의 답변을 다음 AI가 차례로 검증·보완합니다">교차검증</button>
      </div>
      <div id="ai-chips" title="눌러서 사용할 AI를 켜고 끕니다. 교차검증은 켠 순서대로 진행합니다."></div>
    </div>
    <div class="actions">
      <div class="segmented" role="group" aria-label="화면 전환">
        <button type="button" id="view-answers" aria-pressed="true">답변</button>
        <button type="button" id="view-sites" aria-pressed="false">사이트</button>
      </div>
      <button type="button" id="login" class="ghost">사이트로 로그인</button>
    </div>
  </header>
  <main>
    <div id="frames"></div>
    <div id="answers">
      <div id="question-bar" hidden>
        <p id="question"></p>
        <label class="judge">종합 담당 <select id="judge"></select></label>
        <button type="button" id="synthesize" disabled>답변 종합하기</button>
      </div>
      <section class="column" id="synthesis" hidden>
        <header>
          <h2>종합 <span id="sources"></span></h2>
          <span class="byline"><span id="judge-name"></span><button type="button" class="copy">복사</button></span>
        </header>
        <div class="answer"></div>
      </section>
      <div id="columns"></div>
    </div>
  </main>
  <form id="form">
    <div class="composer">
      <textarea id="prompt" rows="1" placeholder="선택한 AI에게 물어보기" autofocus></textarea>
      <button id="send" aria-label="전송" disabled>↑</button>
    </div>
    <p class="hint">
      <label><input type="checkbox" id="new-session"> 질문마다 새 대화로 시작</label>
      <span>Enter 전송 · Shift+Enter 줄바꿈</span>
    </p>
  </form>
  <script type="module" src="page.js"></script>
</body>
</html>
